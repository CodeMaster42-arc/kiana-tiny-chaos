<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#254f52"><meta name="description" content="Drop Kiana, time one bounce, and set off a little chaos. Ten original physics puzzles."><title>Kiana · Tiny Chaos</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"></head><body>
<main id="game"><canvas id="board" aria-label="Physics playfield. Drag to choose a drop position, release to drop, then tap once to bounce." tabindex="0"></canvas>
<header><button id="pause" class="round" aria-label="Pause game">Ⅱ</button><button id="title" aria-label="Choose a level"><strong>KIANA</strong><span>TINY CHAOS</span></button><button id="retry" class="round" aria-label="Restart level">↶</button></header>
<div class="hud"><button id="level" aria-label="Choose a level">LEVEL 01</button><span id="drops" aria-label="3 drops remaining"></span><span id="rescued" aria-live="polite">0 / 1 <span class="bubble-icon">●</span></span></div>
<div id="level-name">A little hello</div><div id="hint" role="status">Slide to aim. Release to drop.</div>
<div class="bottom"><button id="action">DROP <span>↓</span></button><div class="bottom-row"><button id="sound" aria-label="Mute sound">Sound on</button><span id="caption">One drop. One bounce. A little chaos.</span><button id="help" aria-label="How to play">?</button></div></div>
<div id="overlay" role="dialog" aria-modal="true" aria-label="Game menu" hidden><section class="card" id="panel"></section></div><div id="announcement" class="sr" aria-live="polite"></div>
</main><aside class="desktop-note"><span>KIANA / TINY CHAOS</span><p>Small creature.<br>Big chain reactions.</p><small>A ten-level playable prototype.<br>Drag, release, then tap to bounce.</small></aside>
<script src="physics.js"></script><script src="levels.js"></script><script src="game.js?v=5"></script></body></html>
